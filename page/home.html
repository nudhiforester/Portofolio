<!-- Hero halaman Home dimuat ke dalam main oleh assets/js/main.js. -->
<section class="hero" id="home" aria-labelledby="hero-title">
  <p class="hero__backdrop" aria-hidden="true" data-copy="backdrop">Portofolio</p>

  <div class="hero__content">
    <p class="hero__greeting reveal reveal--down" data-reveal data-copy="greeting">Assalamualaikum</p>
    <p class="hero__role reveal reveal--down" data-reveal data-copy="role">Web Developer</p>

    <h1 class="hero__title" id="hero-title">
      <span class="hero__name hero__name--first reveal reveal--left" data-reveal data-copy="firstName">Solihul</span>
      <span class="hero__name hero__name--last reveal reveal--right" data-reveal data-copy="lastName">Hadi</span>
    </h1>

    <p class="hero__intro reveal reveal--left" data-reveal data-copy="intro">Saya</p>
    <p class="hero__skill hero__skill--left reveal reveal--left" data-reveal data-copy="skillLeft">PHP + Javascript</p>
    <p class="hero__skill hero__skill--right reveal reveal--right" data-reveal data-copy="skillRight">Python</p>

    <img
      class="hero__portrait"
      src="assets/img/user/person.png"
      alt="Solihul Hadi, Web Developer"
      width="375"
      height="1024"
      fetchpriority="high"
      data-portrait
    >
  </div>
</section>
