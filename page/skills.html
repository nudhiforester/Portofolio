<!-- Skill cards are generated from data/skills.json after this page is loaded. -->
<section class="skills-page" aria-labelledby="skills-title">
  <h1 class="skills-page__heading" id="skills-title">
    <i class="ri-book-open-line" aria-hidden="true"></i>
    <span>Skills</span>
  </h1>

  <div class="skills-carousel">
    <div class="swiper skills-swiper" data-skills-carousel>
      <div class="swiper-wrapper" data-skills-track aria-live="polite"></div>
    </div>
    <div class="swiper-pagination skills-pagination" aria-label="Navigasi skill"></div>
  </div>

  <dialog class="skill-dialog" data-skill-dialog aria-labelledby="skill-dialog-title">
    <div class="skill-dialog__content">
      <button class="skill-dialog__close" type="button" aria-label="Tutup grafik" data-skill-dialog-close>
        <i class="ri-close-line" aria-hidden="true"></i>
      </button>
      <h2 class="skill-dialog__title" id="skill-dialog-title" data-skill-dialog-title></h2>
      <div class="skill-dialog__chart" data-skill-chart role="img" aria-label="Grafik batang vertikal statistik skill"></div>
    </div>
  </dialog>
</section>
