<!-- Contact information and the Google Maps viewer are populated from local JSON. -->
<section class="contact-page" aria-labelledby="contact-title">
  <h1 class="contact-page__heading reveal reveal--down" id="contact-title" data-reveal>
    <i class="ri-smartphone-line" aria-hidden="true"></i>
    <span>Contact</span>
  </h1>

  <div class="contact-carousel reveal reveal--right" data-contact-carousel aria-label="Carousel informasi kontak">
    <button class="contact-carousel__control contact-carousel__control--previous" type="button" aria-label="Kontak sebelumnya" data-contact-previous>
      <i class="ri-arrow-left-double-line" aria-hidden="true"></i>
    </button>

    <p class="contact-carousel__information" data-contact-information aria-live="polite"></p>

    <div class="contact-carousel__stage">
      <div class="contact-carousel__orbit" aria-hidden="true"></div>
      <img class="contact-carousel__portrait" src="assets/img/user/person.png" alt="" />
      <ul class="contact-list" data-contact-list aria-label="Informasi kontak"></ul>
    </div>

    <button class="contact-carousel__control contact-carousel__control--next" type="button" aria-label="Kontak berikutnya" data-contact-next>
      <i class="ri-arrow-right-double-line" aria-hidden="true"></i>
    </button>
  </div>
</section>
