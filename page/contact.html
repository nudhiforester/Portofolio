<!-- Contact information and the Google Maps viewer are populated from local JSON. -->
<section class="contact-page" aria-labelledby="contact-title">
  <h1 class="contact-page__heading reveal reveal--down" id="contact-title" data-reveal>
    <i class="ri-smartphone-line" aria-hidden="true"></i>
    <span>Contact</span>
  </h1>

  <div class="contact-layout">
    <ul class="contact-list" data-contact-list aria-label="Informasi kontak"></ul>

    <section class="contact-map reveal reveal--right" aria-labelledby="contact-map-title" data-reveal>
      <h2 class="contact-map__heading" id="contact-map-title">Lokasi</h2>
      <iframe
        class="contact-map__frame"
        title="Peta lokasi Solihul Hadi"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
        data-contact-map
      ></iframe>
      <a class="contact-map__link" href="#" target="_blank" rel="noopener noreferrer" data-contact-map-link>
        Buka di Google Maps
        <i class="ri-external-link-line" aria-hidden="true"></i>
      </a>
    </section>
  </div>
</section>
